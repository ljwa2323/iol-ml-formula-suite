<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 12px; font-family: sans-serif; font-size: 14px; }
    h3 { margin: 0 0 10px 0; }
    section { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; }
    input[type="file"] { width: 100%; margin-bottom: 6px; }
    button { padding: 8px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
    .status { color: #666; font-size: 12px; margin-top: 6px; }
    .error { color: #c00; }
    .ok { color: #080; }
  </style>
</head>
<body>
  <h3>RBF Fill & Collect</h3>
  <section>
    <label>1. Load pending data (rbf_pending.json)</label>
    <input type="file" id="fileInput" accept=".json">
    <div id="loadStatus" class="status"></div>
  </section>
  <section>
    <label>2. On RBF page: fill next sample</label>
    <button id="btnFill">Fill next sample</button>
    <div id="fillStatus" class="status"></div>
  </section>
  <section>
    <label>3. After you click Calculate and pass verification:</label>
    <button id="btnCollect">Collect result</button>
    <div id="collectStatus" class="status"></div>
  </section>
  <section>
    <label>4. Export collected results</label>
    <button id="btnExport">Download results (JSON)</button>
    <div id="exportStatus" class="status"></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
